<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  .gantt { width: 100%; font-family: var(--font-sans); color: var(--foreground); font-size: 13px; }
  .row { display: grid; grid-template-columns: 112px 1fr; align-items: center; height: 36px; }
  .row + .row { border-top: 1px solid var(--border); }
  .head { height: 30px; color: var(--muted-foreground); font-size: 12px; border-top: 0 !important; }
  .label { padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label small { display: block; color: var(--muted-foreground); font-size: 11px; line-height: 1.1; }
  .weeks, .track { position: relative; height: 100%; display: grid; grid-template-columns: repeat(6, 1fr); }
  .weeks span { display: flex; align-items: center; padding-left: 6px; border-left: 1px solid var(--border); }
  .track::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(to right, var(--border) 0, var(--border) 1px, transparent 1px, transparent calc(100% / 6));
    opacity: .7;
  }
  .bar {
    position: absolute; top: 8px; height: 20px; border-radius: var(--radius);
    background: var(--chart-1); color: var(--primary-foreground);
    display: flex; align-items: center; padding: 0 8px; font-size: 11px; white-space: nowrap; overflow: hidden;
  }
  .c2 { background: var(--chart-2); } .c3 { background: var(--chart-3); }
  .c4 { background: var(--chart-4); } .c5 { background: var(--chart-5); } .c6 { background: var(--chart-6); }
  .milestone {
    position: absolute; top: 11px; width: 14px; height: 14px; margin-left: -7px;
    background: var(--accent); transform: rotate(45deg); border-radius: 2px;
  }
  .today { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--destructive); }
  @media (max-width: 480px) {
    .row { grid-template-columns: 84px 1fr; }
    .bar span { display: none; }
  }
</style>
</head>
<body>
<div class="gantt" role="img" aria-label="Gantt timeline of a 6-week project">
  <div class="row head">
    <div class="label">Task</div>
    <div class="weeks"><span>W1</span><span>W2</span><span>W3</span><span>W4</span><span>W5</span><span>W6</span></div>
  </div>

  <div class="row">
    <div class="label">Discovery</div>
    <div class="track"><div class="bar c1" style="left:0;width:16.67%"><span>Kickoff, research</span></div></div>
  </div>
  <div class="row">
    <div class="label">Design</div>
    <div class="track"><div class="bar c2" style="left:12%;width:30%"><span>Wireframes to UI</span></div></div>
  </div>
  <div class="row">
    <div class="label">Backend</div>
    <div class="track"><div class="bar c3" style="left:25%;width:41.67%"><span>API and data model</span></div></div>
  </div>
  <div class="row">
    <div class="label">Frontend</div>
    <div class="track"><div class="bar c4" style="left:37.5%;width:41.67%"><span>Screens and integration</span></div></div>
  </div>
  <div class="row">
    <div class="label">QA</div>
    <div class="track"><div class="bar c5" style="left:66.67%;width:20.83%"><span>Test and fix</span></div></div>
  </div>
  <div class="row">
    <div class="label">Launch</div>
    <div class="track"><div class="bar c6" style="left:83.33%;width:16.67%"><span>Release</span></div></div>
  </div>
  <div class="row">
    <div class="label">Milestones</div>
    <div class="track">
      <div class="milestone" style="left:16.67%" title="Research complete"></div>
      <div class="milestone" style="left:50%" title="Beta"></div>
      <div class="milestone" style="left:99%" title="Launch"></div>
    </div>
  </div>
</div>
</body>
</html>
