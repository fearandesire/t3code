<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; }
  .page { width: 100%; font-family: var(--font-sans); color: var(--foreground); }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    background: var(--background);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .range { display: flex; gap: 4px; }
  .range span {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: var(--radius);
    color: var(--muted-foreground);
  }
  .range span.on { background: var(--secondary); color: var(--secondary-foreground); }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }
  .kpi {
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .kpi .label { font-size: 12px; color: var(--muted-foreground); }
  .kpi .value { font-size: 24px; font-weight: 600; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .delta { font-size: 12px; margin-top: 4px; }
  .up { color: var(--success); }
  .down { color: var(--destructive); }

  .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .chart-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .chart-head small { color: var(--muted-foreground); font-size: 12px; }

  .chart-wrap { width: 100%; height: 260px; position: relative; }
  canvas { display: block; width: 100%; height: 260px; }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Pulse Analytics</div>
    <div class="range"><span>24h</span><span class="on">30d</span><span>90d</span></div>
  </div>

  <div class="kpis">
    <div class="kpi"><div class="label">Revenue</div><div class="value">$48.2k</div><div class="delta up">+12.4%</div></div>
    <div class="kpi"><div class="label">Active users</div><div class="value">9,314</div><div class="delta up">+5.1%</div></div>
    <div class="kpi"><div class="label">Conversion</div><div class="value">3.8%</div><div class="delta down">-0.4%</div></div>
    <div class="kpi"><div class="label">Avg. latency</div><div class="value">182 ms</div><div class="delta up">-9.0%</div></div>
  </div>

  <div class="chart-head"><h2>Daily active users</h2><small>Last 30 days</small></div>
  <div class="chart-wrap"><canvas id="chart" role="img" aria-label="Area chart of daily active users over the last 30 days"></canvas></div>
</div>

<script>
(function () {
  var canvas = document.getElementById('chart');
  var ctx = canvas.getContext('2d');
  var H = 260;

  var data = [];
  var v = 5200;
  for (var i = 0; i < 30; i++) {
    v += Math.sin(i * 0.7) * 260 + (i * 38) + ((i * 53) % 7 - 3) * 60;
    data.push(Math.round(v));
  }

  function cssVar(name, fallback) {
    var val = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return val || fallback;
  }

  function draw() {
    var dpr = window.devicePixelRatio || 1;
    var W = canvas.clientWidth;
    if (!W) return;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    var line = cssVar('--chart-1', '#4f8cff');
    var grid = cssVar('--border', '#8884');
    var muted = cssVar('--muted-foreground', '#888');

    var padTop = 16, padBottom = 22;
    var plotH = H - padTop - padBottom;
    var min = Math.min.apply(null, data) * 0.95;
    var max = Math.max.apply(null, data) * 1.03;
    var x = function (i) { return (i / (data.length - 1)) * W; };
    var y = function (val) { return padTop + (1 - (val - min) / (max - min)) * plotH; };

    // gridlines
    ctx.strokeStyle = grid;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.7;
    for (var g = 0; g <= 3; g++) {
      var gy = Math.round(padTop + (g / 3) * plotH) + 0.5;
      ctx.beginPath();
      ctx.moveTo(0, gy);
      ctx.lineTo(W, gy);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // area fill, full bleed edge to edge
    ctx.beginPath();
    ctx.moveTo(x(0), y(data[0]));
    for (var i = 1; i < data.length; i++) {
      var cx = (x(i - 1) + x(i)) / 2;
      ctx.bezierCurveTo(cx, y(data[i - 1]), cx, y(data[i]), x(i), y(data[i]));
    }
    var areaPath = new Path2D();
    ctx.lineTo(W, H - padBottom);
    ctx.lineTo(0, H - padBottom);
    ctx.closePath();
    ctx.fillStyle = line;
    ctx.globalAlpha = 0.22;
    ctx.fill();
    ctx.globalAlpha = 1;

    // fade the fill toward the baseline
    var mask = ctx.createLinearGradient(0, padTop, 0, H - padBottom);
    mask.addColorStop(0, 'rgba(0,0,0,0)');
    mask.addColorStop(1, 'rgba(0,0,0,1)');
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = mask;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, padTop, W, plotH);
    ctx.restore();

    // line
    ctx.beginPath();
    ctx.moveTo(x(0), y(data[0]));
    for (var j = 1; j < data.length; j++) {
      var mx = (x(j - 1) + x(j)) / 2;
      ctx.bezierCurveTo(mx, y(data[j - 1]), mx, y(data[j]), x(j), y(data[j]));
    }
    ctx.strokeStyle = line;
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // end marker
    ctx.beginPath();
    ctx.arc(x(data.length - 1) - 4, y(data[data.length - 1]), 3.5, 0, Math.PI * 2);
    ctx.fillStyle = line;
    ctx.fill();

    // x labels
    ctx.fillStyle = muted;
    ctx.font = '11px ' + cssVar('--font-sans', 'sans-serif');
    ctx.textBaseline = 'alphabetic';
    var labels = ['Day 1', 'Day 10', 'Day 20', 'Day 30'];
    var idx = [0, 9, 19, 29];
    for (var k = 0; k < labels.length; k++) {
      var tx = x(idx[k]);
      ctx.textAlign = k === 0 ? 'left' : (k === labels.length - 1 ? 'right' : 'center');
      ctx.fillText(labels[k], tx, H - 6);
    }
  }

  draw();
  if (window.ResizeObserver) new ResizeObserver(draw).observe(canvas);
  else window.addEventListener('resize', draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ['style', 'class', 'data-theme'] });
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', draw);
  }
})();
</script>
</body>
</html>
